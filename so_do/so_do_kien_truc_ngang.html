<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sơ đồ kiến trúc ngang</title>
<style>
:root{--bg:#1d1d1b;--dot:#34332f;--card:#2b2b28;--ink:#f1f0ea;--mute:#bdbbb1;--line:#4d4c46;--co:#3ec982;--mot:#f0b429;--chua:#a8a69c;--ac:#ff7a3d;--edge:#b8b6ac}
:root[data-theme=light]{--bg:#ebe8de;--dot:#cfcabb;--card:#faf9f4;--ink:#1a1a18;--mute:#555450;--line:#c9c5b8;--co:#14804a;--mot:#c27a00;--chua:#6e6c64;--ac:#d9480f;--edge:#4a4944}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:2px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0 10px 0 0}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:6px 12px}
button{cursor:pointer;font-weight:600}button:hover{border-color:var(--ac);color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.pri:hover{color:#fff;filter:brightness(1.08)}
.chip{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none;font-weight:600;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card)}.chip.off{opacity:.4}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}.d-co{background:var(--co)}.d-mot-phan{background:var(--mot)}.d-chua{background:var(--chua)}
main{flex:1;display:flex;min-height:0}
#vp{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(var(--dot) 1.4px,transparent 1.4px);background-size:24px 24px}
#vp.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--edge);stroke-width:1.8;opacity:.4}#edges path.on{stroke:var(--ac);stroke-width:3.4;opacity:1}#edges path.off{opacity:.08}
.colhead{position:absolute;padding:0 0 8px;pointer-events:none;border-bottom:4px solid}.colhead b{display:block;font-size:19px;line-height:1.2}.colhead span{color:var(--mute);font-size:13px;display:block;margin-top:2px}
.node{position:absolute;width:260px;height:92px;background:#f6f4ec;color:#1a1a18;border:2.5px solid var(--co);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 3px 10px #0007}
.node.mot-phan{border-color:var(--mot)}.node.chua{border-color:var(--chua);border-style:dashed}
.node.sel{outline:4px solid var(--ac);outline-offset:2px}.node.dim{opacity:.2}
.node .h{height:42px;padding:4px 11px;font-weight:700;font-size:14.5px;line-height:1.2;color:#fff;display:flex;align-items:center;overflow:hidden}
.node .h span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .b{padding:5px 11px 0;font:12.5px/1.3 Consolas,monospace;color:#1a1a18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .s{padding:3px 11px 0;display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:#444}
.node .s em{font-style:normal;color:#fff;border-radius:99px;padding:0 9px}.node .s em.co{background:#14804a}.node .s em.mot-phan{background:#b36b00}.node .s em.chua{background:#6e6c64}
aside{width:380px;border-left:2px solid var(--line);background:var(--card);overflow:auto;padding:14px 16px;flex:none;font-size:14.5px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
aside label{display:block;margin:10px 0 3px;color:var(--mute);font-size:13px;font-weight:600}aside input,aside select,aside textarea{width:100%}
aside textarea{min-height:84px;resize:vertical}
.lk{max-height:220px;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px}.lk label{display:flex;gap:8px;margin:2px 0;color:var(--ink);font-size:13.5px;font-weight:400}.lk input{width:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border:1px solid var(--line);padding:5px 8px;text-align:left}th{background:var(--bg)}
.lst{margin:4px 0 10px;padding-left:20px}.lst li{cursor:pointer;margin:2px 0}.lst li:hover{color:var(--ac)}
.hint{color:var(--mute);font-size:13.5px}
@media(max-width:800px){aside{display:none;position:absolute;right:0;top:0;bottom:0;width:min(380px,92vw);z-index:5}aside.open{display:block}header h1{font-size:15px}}
</style></head><body>

aude, key Gemini API, nạp cookie JSON, số luồng"], "links": ["web-ui", "runner-srv"], "dieu": "", "ghi_chu": ""}, {"id": "runner-srv", "layer": "web", "grp": "", "name": "Runner server 127.0.0.1:8787", "path": "runner/src/server.ts", "st": "co", "items": ["/phien /job /lo /gemini/* /claude/*", "Chỉ nhận origin localhost, github.io"], "links": ["web-ui", "runner-lo", "eng-claude", "eng-gapi", "eng-gweb", "web-lk"], "dieu": "", "ghi_chu": ""}, {"id": "runner-lo", "layer": "web", "grp": "", "name": "Chạy lô song song + lưu tạm", "path": "runner/src/lo.ts", "st": "co", "items": ["Gemini API 10 luồng, Claude 3 luồng, Gemini web 1 tab", "Lưu từng job, chạy lại thì dùng lại"], "links": ["runner-srv", "runner-cli", "eng-claude", "eng-gapi", "eng-gweb"], "dieu": "", "ghi_chu": ""}, {"id": "eng-claude", "layer": "web", "grp": "", "name": "Engine Claude Code", "path": "runner/src/engines/claude.ts", "st": "co", "items": ["claude -p, chỉ Read/Grep/Glob", "Token sk-ant-… lưu runner/claude_token.json"], "links": ["runner-srv", "runner-lo"], "dieu": "", "ghi_chu": ""}, {"id": "eng-gapi", "layer": "web", "grp": "", "name": "Engine Gemini API", "path": "runner/src/engines/gemini_api.ts", "st": "mot-phan", "items": ["Files API + generateContent, lùi dần khi 429", "Mới qua test giả lập: chờ key thật"], "links": ["runner-srv", "runner-lo"], "dieu": "", "ghi_chu": "Cần API key từ aistudio.google.com/apikey."}, {"id": "eng-gweb", "layer": "web", "grp": "", "name": "Engine Gemini web", "path": "runner/src/engines/gemini.ts · gemini_cookies.ts", "st": "mot-phan", "items": ["Chrome ẩn + cookie JSON tự làm mới", "1 tab tuần tự, có nghỉ; gặp xác minh thì dừng"], "links": ["runner-srv", "runner-lo"], "dieu": "", "ghi_chu": "Đã thử headless đăng nhập OK; chạy lô dài chưa kiểm."}, {"id": "runner-cli", "layer": "web", "grp": "", "name": "CLI cho /tham-dinh", "path": "runner/src/cli.ts", "st": "co", "items": ["chuan-bi · jobs · ra-soat · gop · chay"], "links": ["runner-lo", "cmd-check", "shared-lib"], "dieu": "", "ghi_chu": ""}, {"id": "shared-lib", "layer": "web", "grp": "", "name": "Shared: lõi dùng chung", "path": "shared/src/*.ts", "st": "co", "items": ["schema, agents, chọn bảng, chia mục, prompt, gộp, trích chữ PDF, VNI→Unicode", "10 test vitest"], "links": ["web-ui", "runner-cli", "ag-pccc", "data-bang", "web-view"], "dieu": "", "ghi_chu": ""}, {"id": "data-bang", "layer": "web", "grp": "", "name": "58 bảng đối chiếu + mẫu Word", "path": "data/bang/*.json · data/mau/*.docx", "st": "co", "items": ["Sinh bởi data-build/build_data.py", "10 bảng .doc đã chuyển bằng Word"], "links": ["shared-lib", "web-ui", "web-xuat"], "dieu": "", "ghi_chu": ""}, {"id": "deploy", "layer": "web", "grp": "", "name": "Deploy web", "path": ".github/workflows/pages.yml · netlify.toml", "st": "mot-phan", "items": ["Code đã push; build web/dist xong", "GitHub Pages chưa bật; Netlify chờ người dùng kéo thả/nối repo"], "links": ["web-ui"], "dieu": "", "ghi_chu": ""}, {"id": "auto-resume", "layer": "web", "grp": "", "name": "Tự chạy tiếp khi reset hạn mức", "path": "(tác vụ hẹn giờ)", "st": "chua", "items": ["Bị bộ phân loại an toàn chặn 2 lần", "Cần người dùng cho phép create_scheduled_task"], "links": [], "dieu": "", "ghi_chu": "Tiến độ ghi ở TIEN_DO.md để làm tiếp bằng tay."}]}</script>
<script>
const KEY="pccc.sodo.ngang.v1",W=260,H=92,ST={co:"Đã có","mot-phan":"Một phần",chua:"Chưa làm"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const seed=()=>JSON.parse($("#seed").textContent);
const ls={get(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}},del(){try{localStorage.removeItem(KEY)}catch{}}};
let showP=false,D=ls.get()||seed(),sel=null,tab="ct",view={x:20,y:10,k:.55},hide=new Set(),q="",drag=null,pan=null;
const save=()=>ls.set(D),byId=id=>D.nodes.find(n=>n.id===id),col=l=>(D.layers.find(x=>x.id===l)||{}).c||"#888";

function layout(force){let x=40;for(const L of D.layers){const ns=D.nodes.filter(n=>n.layer===L.id),c=Math.max(1,Math.ceil(ns.length/10));L._x=x;L._w=c*(W+80)-80;
 ns.forEach((n,i)=>{if(force||n.x==null){n.x=x+Math.floor(i/10)*(W+80);n.y=120+(i%10)*(H+46)}});x+=L._w+150}}
function apply(){$("#world").style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`}
function edges(){const seen=new Set();let h="";
 for(const a of D.nodes)for(const id of a.links||[]){const b=byId(id);if(!b||hide.has(a.st)||hide.has(b.st))continue;const k=[a.id,b.id].sort().join("|");if(seen.has(k))continue;seen.add(k);
  const [s,t]=a.x<=b.x?[a,b]:[b,a],x1=s.x+W,y1=s.y+H/2,x2=t.x,y2=t.y+H/2,d=Math.max(70,Math.abs(x2-x1)/2),on=sel&&(a.id===sel||b.id===sel);
  h+=`<path d="M${x1},${y1} C${x1+d},${y1} ${x2-d},${y2} ${x2},${y2}" class="${on?"on":sel?"off":""}"/>`}
 $("#edges").innerHTML=h}
function render(){layout(false);const w=$("#world");w.querySelectorAll(".node,.colhead").forEach(e=>e.remove());
 for(const L of D.layers){const h=document.createElement("div");h.className="colhead";Object.assign(h.style,{left:L._x+"px",top:"10px",width:L._w+"px",borderColor:L.c});h.innerHTML=`<b style="color:${L.c}">${esc(L.name)}</b><span>${esc(L.hint||"")}</span>`;w.appendChild(h)}
 const rel=new Set(sel?[sel,...(byId(sel)?.links||[])]:[]);
 for(const n of D.nodes){if(hide.has(n.st))continue;const e=document.createElement("div");
  e.className="node "+n.st+(n.id===sel?" sel":"")+((q&&!(n.name+n.path).toLowerCase().includes(q))||(sel&&!rel.has(n.id))?" dim":"");
  e.style.left=n.x+"px";e.style.top=n.y+"px";e.dataset.id=n.id;
  e.title=n.name;e.innerHTML=`<div class="h" style="background:${col(n.layer)}"><span>${esc(n.name)}</span></div><div class="b">${esc(n.path)||"—"}</div><div class="s"><em class="${n.st}">${ST[n.st]}</em>${n.grp?esc(n.grp):""}</div>`;
  e.addEventListener("pointerdown",ev=>{if(ev.button)return;ev.stopPropagation();e.setPointerCapture(ev.pointerId);drag={n,e,sx:ev.clientX,sy:ev.clientY,ox:n.x,oy:n.y,mv:false}});w.appendChild(e)}
 edges();chips();panel()}
function chips(){$("#chips").innerHTML=Object.entries(ST).map(([k,v])=>`<span class="chip ${hide.has(k)?"off":""}" data-k="${k}"><i class="dot d-${k}"></i>${v} ${D.nodes.filter(n=>n.st===k).length}</span>`).join(" ");
 document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{hide.has(c.dataset.k)?hide.delete(c.dataset.k):hide.add(c.dataset.k);render()})}
function toggleLink(a,b){const A=byId(a),B=byId(b);if(!A||!B)return;const has=A.links.includes(b);
 A.links=has?A.links.filter(x=>x!==b):[...A.links,b];B.links=has?B.links.filter(x=>x!==a):[...B.links,a];save()}
window.addEventListener("pointermove",e=>{if(drag){const dx=(e.clientX-drag.sx)/view.k,dy=(e.clientY-drag.sy)/view.k;if(Math.abs(dx)+Math.abs(dy)>3/view.k)drag.mv=true;
  if(drag.mv){drag.n.x=Math.round(drag.ox+dx);drag.n.y=Math.round(drag.oy+dy);drag.e.style.left=drag.n.x+"px";drag.e.style.top=drag.n.y+"px";edges()}}
 else if(pan){view.x=pan.vx+e.clientX-pan.sx;view.y=pan.vy+e.clientY-pan.sy;apply()}});
window.addEventListener("pointerup",e=>{if(drag){const d=drag;drag=null;if(d.mv)save();else{if(e.shiftKey&&sel&&sel!==d.n.id)toggleLink(sel,d.n.id);else{sel=d.n.id;tab="ct"}render()}}
 if(pan){pan=null;$("#vp").classList.remove("pan")}});
$("#vp").addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};$("#vp").classList.add("pan")});
addEventListener("keydown",e=>{if(e.key==="Escape"&&sel&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")){sel=null;render()}else if(e.key==="Escape"&&document.activeElement?.blur){document.activeElement.blur()}});
$("#vp").addEventListener("wheel",e=>{e.preventDefault();const r=$("#vp").getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.max(.15,Math.min(2,view.k*(e.deltaY<0?1.12:1/1.12)));
 view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;apply()},{passive:false});
function fit(){const xs=D.nodes.filter(n=>!hide.has(n.st));if(!xs.length)return;const r=$("#vp").getBoundingClientRect(),x0=Math.min(...xs.map(n=>n.x))-20,x1=Math.max(...xs.map(n=>n.x+W))+20,y1=Math.max(...xs.map(n=>n.y+H))+20,k=Math.min(r.width/(x1-x0),r.height/y1,1);
 view={k,x:-x0*k+(r.width-(x1-x0)*k)/2,y:8};apply()}

function panel(){const s=$("#side"),n=sel&&byId(sel);s.classList.toggle("open",showP||!!n);
 let h=`<div class="tabs"><button data-t="ct" class="${tab==="ct"?"on":""}">Chi tiết</button><button data-t="tk" class="${tab==="tk"?"on":""}">Thống kê</button></div>`;
 if(tab==="tk")h+=stats();else if(!n)h+=`<p class="hint">Bấm một module để xem và sửa. Kéo nền để di chuyển (không bỏ chọn), cuộn chuột để thu phóng, <b>Esc</b> để bỏ chọn, kéo module để đổi vị trí. <b>Shift+bấm</b> module khác để nối/bỏ nối với module đang chọn.</p>`;
 else h+=`<label>Tên</label><input id="fName" value="${esc(n.name)}"><label>Đường dẫn / file</label><input id="fPath" value="${esc(n.path)}">
  <label>Cột</label><select id="fLayer">${D.layers.map(l=>`<option value="${l.id}" ${l.id===n.layer?"selected":""}>${esc(l.name)}</option>`).join("")}</select>
  <label>Nhóm (tuỳ chọn)</label><input id="fGrp" value="${esc(n.grp)}"><label>Trạng thái</label><select id="fSt">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===n.st?"selected":""}>${v}</option>`).join("")}</select>
  <label>Nội dung (mỗi dòng một ý)</label><textarea id="fItems">${esc((n.items||[]).join("\n"))}</textarea><label>Điều khoản</label><input id="fDieu" value="${esc(n.dieu)}"><label>Ghi chú</label><textarea id="fGhi">${esc(n.ghi_chu)}</textarea>
  <label>Liên kết (${n.links.length})</label><input id="fFind" placeholder="Lọc danh sách…"><div class="lk">${D.nodes.filter(x=>x.id!==n.id).map(x=>`<label data-t="${esc((x.name+x.path).toLowerCase())}"><input type="checkbox" data-id="${x.id}" ${n.links.includes(x.id)?"checked":""}>${esc(x.name)}</label>`).join("")}</div>
  <p><button id="bDel">Xoá module</button></p>`;
 s.innerHTML=h;s.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;panel()});
 if(tab==="tk"){s.querySelectorAll("[data-go]").forEach(li=>li.onclick=()=>{sel=li.dataset.go;tab="ct";const m=byId(sel),r=$("#vp").getBoundingClientRect();view.x=r.width/2-(m.x+W/2)*view.k;view.y=r.height/2-(m.y+H/2)*view.k;apply();render()})}
 if(n&&tab==="ct"){const set=(f,v)=>{n[f]=v;save();render()};
  $("#fName").onchange=e=>set("name",e.target.value);$("#fPath").onchange=e=>set("path",e.target.value);$("#fGrp").onchange=e=>set("grp",e.target.value);$("#fDieu").onchange=e=>set("dieu",e.target.value);$("#fGhi").onchange=e=>set("ghi_chu",e.target.value);
  $("#fSt").onchange=e=>set("st",e.target.value);$("#fItems").onchange=e=>set("items",e.target.value.split("\n").map(x=>x.trim()).filter(Boolean));
  $("#fLayer").onchange=e=>{n.layer=e.target.value;n.x=null;save();render()};
  $("#fFind").oninput=e=>{const t=e.target.value.toLowerCase();s.querySelectorAll(".lk label").forEach(l=>l.style.display=l.dataset.t.includes(t)?"":"none")};
  s.querySelectorAll(".lk input").forEach(c=>c.onchange=()=>{toggleLink(n.id,c.dataset.id);render()});
  $("#bDel").onclick=()=>{if(!confirm("Xoá module \""+n.name+"\"?"))return;D.nodes=D.nodes.filter(x=>x.id!==n.id);D.nodes.forEach(x=>x.links=x.links.filter(l=>l!==n.id));sel=null;save();render()}}}
function stats(){const c=k=>D.nodes.filter(n=>n.st===k).length,T=D.nodes.length;
 let h=`<p><b>${T}</b> module · <span style="color:var(--co)">Đã có ${c("co")}</span> · <span style="color:var(--mot)">Một phần ${c("mot-phan")}</span> · Chưa làm ${c("chua")} · hoàn thành ${Math.round((c("co")+c("mot-phan")*.5)/T*100)}%</p>
 <table><tr><th>Cột</th><th>Có</th><th>Một phần</th><th>Chưa</th></tr>`;
 for(const L of D.layers){const ns=D.nodes.filter(n=>n.layer===L.id),f=k=>ns.filter(n=>n.st===k).length;h+=`<tr><td>${esc(L.name)}</td><td>${f("co")}</td><td>${f("mot-phan")}</td><td>${f("chua")}</td></tr>`}
 h+="</table>";
 for(const [k,t] of [["chua","Chưa làm"],["mot-phan","Làm một phần"]]){const ls=D.nodes.filter(n=>n.st===k);h+=`<h4>${t} (${ls.length})</h4>`;
  for(const L of D.layers){const ns=ls.filter(n=>n.layer===L.id);if(ns.length)h+=`<div class="hint">${esc(L.name)}</div><ul class="lst">${ns.map(n=>`<li data-go="${n.id}">${esc(n.name)}</li>`).join("")}</ul>`}}
 return h}

function viewCenter(){const r=$("#vp").getBoundingClientRect();return{x:(r.width/2-view.x)/view.k-W/2,y:(r.height/2-view.y)/view.k-H/2}}
$("#bAdd").onclick=()=>{const p=viewCenter(),n={id:"n"+Date.now().toString(36),layer:byId(sel)?.layer||D.layers[0].id,grp:"",name:"Module mới",path:"",st:"chua",items:[],links:[],dieu:"",ghi_chu:"",x:Math.round(p.x),y:Math.round(p.y)};D.nodes.push(n);sel=n.id;tab="ct";save();render()};
$("#bCol").onclick=()=>{const name=prompt("Tên cột mới:");if(!name)return;D.layers.push({id:"l"+Date.now().toString(36),name,hint:"",c:"#"+Math.floor(Math.random()*0x777777+0x444444).toString(16)});save();render()};
$("#bPanel").onclick=()=>{showP=!showP;if(!showP&&sel)sel=null;if(showP&&!sel)tab="tk";render()};$("#bFit").onclick=fit;$("#bAuto").onclick=()=>{layout(true);save();render();fit()};
$("#bExp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="so_do_kien_truc.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
$("#bImp").onclick=()=>$("#fImp").click();
$("#fImp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.nodes)||!Array.isArray(j.layers))throw 0;D=j;sel=null;save();render();fit()}catch{alert("File không đúng định dạng (cần có layers và nodes).")}};
$("#bReset").onclick=()=>{if(confirm("Bỏ mọi chỉnh sửa, quay về dữ liệu gốc?")){ls.del();D=seed();sel=null;render();fit()}};
$("#bTheme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};
